[build-system]
requires = ["setuptools>=61.0.0", "wheel", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrie"
version = "1.1.0"
authors = [
    { name = "Ivan Kholodilo", email = "iholodilo2008@gmail.com" }
]
description = "Adaptive Variable Order Markov Models (VOMM) via Reverse Suffix Tries with Information-Theoretic Shrinkage for streaming sequence prediction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = [
    "markov-models",
    "variable-order-markov-models",
    "vomm",
    "suffix-trie",
    "sequence-prediction",
    "anomaly-detection",
    "information-theory",
    "empirical-bayes",
    "cython",
    "online-learning",
    "streaming-algorithms",
    "fault-detection"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
full = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "catboost>=1.0.0",
    "optuna>=3.0.0",
    "torch>=1.12.0",
    "matplotlib>=3.5.0",
    "tiktoken>=0.5.0",
    "jupyter>=1.0.0",
    "pytest>=7.0.0",
]
benchmark = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "catboost>=1.0.0",
    "optuna>=3.0.0",
    "torch>=1.12.0",
    "matplotlib>=3.5.0",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Icold21/token-trie"
Documentation = "https://github.com/Icold21/token-trie#readme"
Repository = "https://github.com/Icold21/token-trie.git"
Issues = "https://github.com/Icold21/token-trie/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokentrie*"]

[tool.setuptools.package-data]
tokentrie = ["*.pyi", "*.pxd", "py.typed"]